<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      crossorigin="anonymous"
    />
    <style>
      .nav-item:hover {
        background-color: #752e98;
        font-weight: bold;
        border-radius: 10px;
        transition: 0.5s;
      }
      .btn {
        background-color: #b143e8;
      }

      .btn:hover {
        background-color: #752e98;
        box-shadow: 0px 0px 5px black;
        font-weight: bold;
        transition: 0.3s;
      }

      .card-img-top {
        height: 200px;
        object-fit: cover;
      }

      .card-body {
        display: flex;
        flex-direction: column;
      }

      .card-body .btn {
        margin-top: auto;
      }

      .hover:hover {
        box-shadow: 0px 0px 20px rgb(254, 254, 254);
        transform: scale(1.04);
        transition: 0.5s;
      }
    </style>
  </head>
  <body>

                    Navbar
        ===============================-->

      style="background-color: #b143e8"

      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 text-white">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="40"
            height="40"
            fill="currentColor"
            class="bi bi-sunrise-fill"
            viewBox="0 0 16 16"

            />
          </svg>
          Environatural</span
        >
        <ul class="nav nav-pills nav-fill">
          <li class="nav-item">
            <a
              class="nav-link text-white active shadow fw-bold"
              style="background-color: rgb(89, 64, 147)"
              aria-current="page"
              href="#home"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"

    <!--===============================
                    Intro Section
        ===============================-->
    <section class="vh-100" id="home">
      <video

        Your browser does not support the video tag.
      </video>

      <div class="container p-5 h-100 text-center">
        <div class="row h-100 justify-content-center align-items-center">
          <div class="col pt-5 mt-4">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              fill="currentColor"
              class="bi bi-sunrise-fill text-white"
              viewBox="0 0 16 16"

              <path
                d="M7.646 1.146a.5.5 0 0 1 .708 0l1.5 1.5a.5.5 0 0 1-.708.708L8.5 2.707V4.5a.5.5 0 0 1-1 0V2.707l-.646.647a.5.5 0 1 1-.708-.708zM2.343 4.343a.5.5 0 0 1 .707 0l1.414 1.414a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707m11.314 0a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0M11.709 11.5a4 4 0 1 0-7.418 0H.5a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10m13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"
              />
            </svg>
            <h1 class="fw-bold text-white">Welcome to Environatural</h1>
            <p class="fs-5 text-white">see the nature for your self.</p>
          </div>
        </div>
      </div>
    </section>

    <!--===============================
                    card Section
        ===============================-->
    <section class="vh-100" style="background-color: #b143e8" id="Selection">
      <div class="container h-100">
        <div class="row h-100 justify-content-center align-items-center">
          <h1 class="text-white">
            <svg
              xmlns="http://www.w3.org/2000/svg"

              <div class="card-body">
                <h5 class="card-title">Gallery</h5>
                <a href="gallery.html" class="btn btn-primary">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-arrow-right-circle"
                    viewBox="0 0 16 16"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5z"

            <div class="card hover h-100">
              <img src="img/category.jpeg" class="card-img-top" alt="..." />
              <div class="card-body">
                <h5 class="card-title">Categories</h5>
                <a href="#" class="btn btn-primary">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-arrow-right-circle"
                    viewBox="0 0 16 16"

                    <path
                      fill-rule="evenodd"
                      d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5z"
                    />
